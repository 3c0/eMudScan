name: Bug report
description: eMudScan crashes, shows an error, or displays something wrong.
title: "[Bug] "
labels: ["bug"]
assignees: ["3c0"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. If eMudScan judges a software wrongly, please use the **False detection** form instead.
        Before pasting anything, remove what you want to keep private (your user name in folder names, for example).
  - type: input
    id: version
    attributes:
      label: eMudScan version
      description: As shown in the window title, for example "1.3 (20261028)".
      placeholder: "1.3 (20261028)"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows
      description: Edition and build, as in the first line of a saved report (or Settings › System › About).
      placeholder: "Windows 11 Pro 25H2 (10.0.26200.9711)"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what eMudScan did, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log or report
      description: The Log pane (select all, copy), or the relevant part of a saved report (Save report). It is formatted as code automatically.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Before sending
      options:
        - label: I am using the latest version (see the Releases page).
        - label: I removed private information from what I pasted.
          required: true
