name: False detection
description: A software is judged wrongly - a false alarm, a missed problem, a wrong version or date, or it is not listed.
title: "[False detection] "
labels: ["false detection"]
assignees: ["3c0"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks. Open the software's item in eMudScan (double-click), click **Copy all** and paste the text below: it holds everything eMudScan knows about that software.
        Before pasting, remove what you want to keep private (your user name in folder names, for example).
  - type: input
    id: version
    attributes:
      label: eMudScan version
      description: As shown in the window title, for example "1.3 (20261028)".
      placeholder: "1.3 (20261028)"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows
      description: Edition and build, as in the first line of a saved report (or Settings › System › About). Useful for the Windows section's items and for software that is not found.
      placeholder: "Windows 11 Pro 25H2 (10.0.26200.9711)"
  - type: input
    id: software
    attributes:
      label: Software and version
      placeholder: "LibreWolf 159.0-1, Python 3.13.18 installed by uv, ..."
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What is wrong
      options:
        - "False alarm: eMudScan says to update, but the software is protected"
        - "Missed problem: eMudScan says OK, but the software still accepts the compromised certificates"
        - "Wrong version, date or name"
        - "Not listed: the software is installed, but eMudScan does not find it"
        - "Other"
    validations:
      required: true
  - type: textarea
    id: item
    attributes:
      label: What eMudScan says
      description: The text of the item (Copy all), or the lines of the saved report about it.
      render: text
    validations:
      required: true
  - type: textarea
    id: truth
    attributes:
      label: What is true, and how you know
      description: The publisher's release notes or advisory, the result of a test page in that browser, the file eMudScan should have read, where the software is installed...
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before sending
      options:
        - label: I removed private information from what I pasted.
          required: true
