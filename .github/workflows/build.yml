# Builds eMudScan.exe and eMudScan-cli.exe for each push to main and each pull
# request, and creates a draft release when a version tag (1.0, 1.1…) is pushed. See
# docs/building.md.
#
# The actions are pinned to exact commits (a version tag can be moved, a commit
# cannot); Dependabot proposes their updates (.github/dependabot.yml).
name: Build

on:
  push:
    branches: [main]
    tags: ['[0-9]*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: stable  # the latest Go release, which receives security fixes
          cache: false        # nothing to cache: eMudScan has no dependencies

      - name: Check, test and build
        run: sh scripts/build.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: eMudScan
          path: |
            dist/eMudScan.exe
            dist/eMudScan-cli.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write           # create the release
      id-token: write           # sign the build attestation
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: eMudScan
          path: dist

      - name: Check the version and write the release notes
        run: |
          version=$(sed -n 's/^const appVersion *= *"\([^"]*\)".*/\1/p' cmd/emudscan/model.go)
          date=$(sed -n 's/^const appDate *= *"\([^"]*\)".*/\1/p' cmd/emudscan/model.go)
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "::error::The tag $GITHUB_REF_NAME does not match appVersion \"$version\" in cmd/emudscan/model.go"
            exit 1
          fi
          # The release page is not the changelog: its "In this version" part is
          # .github/release-notes/<version>.md, written for the users (New, Improved,
          # Fixed: a short line for each change they can notice). The page links to
          # the changelog for the full list, which must have the version's section
          # (Keep a Changelog: "## [3.1.0] - 2026-12-01").
          heading="## [$version] - ${date:0:4}-${date:4:2}-${date:6:2}"
          if ! grep -qxF "$heading" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section \"$heading\""
            exit 1
          fi
          changes=".github/release-notes/$version.md"
          if ! grep -q '[^[:space:]]' "$changes" 2>/dev/null; then
            echo "::error::$changes, the release notes of this version, is missing or empty"
            exit 1
          fi
          # The release page: .github/release-notes.md, with the version's release
          # notes, the SHA-256 of each exe, the build log, the repository, the version
          # (for the link to its changelog) and the date of the release (for the lines
          # of the Jotti scans) filled in.
          for exe in dist/eMudScan.exe dist/eMudScan-cli.exe; do
            if [ ! -f "$exe" ]; then
              echo "::error::The build did not make $exe"
              exit 1
            fi
          done
          sha=$(sha256sum dist/eMudScan.exe | cut -d ' ' -f 1)
          sha_cli=$(sha256sum dist/eMudScan-cli.exe | cut -d ' ' -f 1)
          log="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          day="${date:0:4}-${date:4:2}-${date:6:2}"
          awk -v sha="$sha" -v sha_cli="$sha_cli" -v url="$log" -v repo="$GITHUB_REPOSITORY" -v day="$day" -v ver="$version" -v changes="$changes" '
            $0 == "@CHANGES@" { while ((getline line < changes) > 0) print line; next }
            { gsub(/@SHA256@/, sha); gsub(/@SHA256_CLI@/, sha_cli); gsub(/@BUILD_LOG@/, url); gsub(/@REPOSITORY@/, repo); gsub(/@DATE@/, day); gsub(/@VERSION@/, ver); print }
          ' .github/release-notes.md > notes.md
          echo "TITLE=eMudScan $version ($date)" >> "$GITHUB_ENV"

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-path: |
            dist/eMudScan.exe
            dist/eMudScan-cli.exe

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/eMudScan.exe dist/eMudScan-cli.exe --draft --verify-tag --title "$TITLE" --notes-file notes.md
