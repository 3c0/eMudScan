# Builds eMudScan.exe for each push to main and each pull request, and creates a
# draft release when a version tag (1.0, 1.1…) is pushed. See docs/building.md.
#
# The actions are pinned to exact commits (a version tag can be moved, a commit
# cannot); Dependabot proposes their updates (.github/dependabot.yml).
name: Build

on:
  push:
    branches: [main]
    tags: ['[0-9]*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: stable  # the latest Go release, which receives security fixes
          cache: false        # nothing to cache: eMudScan has no dependencies

      - name: Check, test and build
        run: sh scripts/build.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: eMudScan
          path: dist/eMudScan.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write           # create the release
      id-token: write           # sign the build attestation
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # the whole history and the tags, for the changes since the previous version

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: eMudScan
          path: dist

      - name: Check the version and write the release notes
        run: |
          version=$(sed -n 's/^const appVersion *= *"\([^"]*\)".*/\1/p' cmd/emudscan/model.go)
          date=$(sed -n 's/^const appDate *= *"\([^"]*\)".*/\1/p' cmd/emudscan/model.go)
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "::error::The tag $GITHUB_REF_NAME does not match appVersion \"$version\" in cmd/emudscan/model.go"
            exit 1
          fi
          # The changes since the previous version published in this repository, from
          # CHANGELOG.md (Keep a Changelog: "## [3.1.0] - 2026-12-01"): the version's
          # section, then, each under its own heading, the sections of the versions
          # between them that have no release here. The previous version is the highest
          # version tag below this one; without one, the version this repository starts
          # from (the appVersion of its first commit).
          heading="## [$version] - ${date:0:4}-${date:4:2}-${date:6:2}"
          if ! grep -qxF "$heading" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section \"$heading\""
            exit 1
          fi
          prev=$({ git tag -l; echo "$version"; } | grep -xE '[0-9]+\.[0-9]+\.[0-9]+' | sort -uV |
            awk -v v="$version" '$0 == v {r = p} {p = $0} END {print r}')
          if [ -z "$prev" ]; then
            first=$(git rev-list --max-parents=0 HEAD | tail -n 1)
            prev=$(git show "$first:cmd/emudscan/model.go" | sed -n 's/^const appVersion *= *"\([^"]*\)".*/\1/p')
          fi
          if ! awk -v v="$version" -v prev="$prev" '
            /^\[[^]]*\]: / {exit}
            /^## / {
              x = $2; gsub(/[][]/, "", x)
              if (x == v) {on = 1; next}
              if (on && x == prev) {found = 1; exit}
              if (on) {print "## In version " x " (" $4 ")"; next}
            }
            on
            END {exit !found}
          ' CHANGELOG.md > changes.md; then
            echo "::error::CHANGELOG.md has no section for $prev, the previous version, below the one of $version"
            exit 1
          fi
          if ! grep -q '[^[:space:]]' changes.md; then
            echo "::error::the section \"$heading\" of CHANGELOG.md is empty"
            exit 1
          fi
          # The release page: .github/release-notes.md, with the version's changes,
          # the SHA-256 of the exe, the build log, the repository and the date of the
          # release (for the line of the Jotti scan) filled in.
          sha=$(sha256sum dist/eMudScan.exe | cut -d ' ' -f 1)
          log="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          day="${date:0:4}-${date:4:2}-${date:6:2}"
          awk -v sha="$sha" -v url="$log" -v repo="$GITHUB_REPOSITORY" -v day="$day" '
            $0 == "@CHANGES@" { while ((getline line < "changes.md") > 0) print line; next }
            { gsub(/@SHA256@/, sha); gsub(/@BUILD_LOG@/, url); gsub(/@REPOSITORY@/, repo); gsub(/@DATE@/, day); print }
          ' .github/release-notes.md > notes.md
          echo "TITLE=eMudScan $version ($date)" >> "$GITHUB_ENV"

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-path: dist/eMudScan.exe

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/eMudScan.exe --draft --verify-tag --title "$TITLE" --notes-file notes.md
